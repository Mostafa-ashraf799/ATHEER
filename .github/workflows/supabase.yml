name: Deploy Supabase (migrations + functions)

# يدوي بس، علشان محدش ينشر على السيرفر بالغلط.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations
        run: supabase db push

      - name: Deploy functions
        run: |
          supabase functions deploy telegram-storage --project-ref "$PROJECT_REF"
          supabase functions deploy tg-auth --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy push --project-ref "$PROJECT_REF"

      - name: Set secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          AUTH_PW_SECRET: ${{ secrets.AUTH_PW_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_BOT_USERNAME="$TELEGRAM_BOT_USERNAME" \
            TELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID" \
            TELEGRAM_WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET" \
            AUTH_PW_SECRET="$AUTH_PW_SECRET" \
            FIREBASE_SERVICE_ACCOUNT="$FIREBASE_SERVICE_ACCOUNT"

      - name: Register Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -d url="https://${PROJECT_REF}.supabase.co/functions/v1/tg-auth" \
            -d secret_token="${TELEGRAM_WEBHOOK_SECRET}" \
            -d allowed_updates='["message"]'
