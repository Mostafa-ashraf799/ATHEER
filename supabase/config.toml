# الدالة دي بتتنده من تيليجرام (webhook) ومن التطبيق قبل تسجيل الدخول، فمفيش JWT.
# الأمان فيها بيتعمل بـ secret token من تيليجرام + token عشوائي لكل طلب دخول.
[functions.tg-auth]
verify_jwt = false

# دالتا الرفع والإشعارات بتتحقق من JWT بتاع المستخدم.
[functions.telegram-storage]
verify_jwt = true

[functions.push]
verify_jwt = true
