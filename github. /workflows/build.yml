name: Build ATHEER from zip

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # لو فيه zip في الريبو: نفكه فوق الملفات (من غير ما نعمل commit)
      - name: Unpack zip
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -n "$Z" ]; then
            mkdir -p _u && unzip -q "$Z" -d _u
            if [ -d _u/ChatApp ]; then cp -a _u/ChatApp/. . ; else cp -a _u/. . ; fi
            rm -rf _u
          fi
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show errors only
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed|Unresolved|Could not' -A2 build.log | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ATHEER-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build fast APK (R8)
        continue-on-error: true
        run: gradle :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ATHEER-fast-apk
          path: app/build/outputs/apk/release/*.apk
